# Builds WinTune and publishes a GitHub release when a tag like v1.2.0 is pushed.
# WinTune.exe and its SHA-256 are attached to the release: the in-app updater downloads them.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/WinTune/WinTune.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o dist

      - name: Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/WinTune.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinTune.exe" | Out-File -Encoding ascii dist/WinTune.exe.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' dist/WinTune.exe dist/WinTune.exe.sha256 `
            --title '${{ github.ref_name }}' --generate-notes
